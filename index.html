<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El desafío de los sinónimos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f4f4f9;
      color: #333;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .oculto {
      display: none;
    }
    .marcador {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .pista-box {
      background-color: #eef6ff;
      border-left: 4px solid #007bff;
      padding: 10px;
      margin: 15px 0;
    }
    .mensaje {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      font-weight: bold;
    }
    .mensaje.exito { background-color: #d4edda; color: #155724; }
    .mensaje.error { background-color: #f8d7da; color: #721c24; }
    .mensaje.info { background-color: #d1ecf1; color: #0c5460; }
    button {
      padding: 10px 15px;
      margin-right: 5px;
      margin-top: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-principal { background-color: #007bff; color: white; }
    .btn-secundario { background-color: #17a2b8; color: white; }
    .btn-peligro { background-color: #dc3545; color: white; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    input[type="text"] {
      width: calc(100% - 22px);
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    ol { padding-left: 20px; }
    li { margin-bottom: 5px; }
  </style>
</head>
<body>

  <div class="card">
    <!-- PANTALLA INICIAL -->
    <div id="pantalla-inicio">
      <h1>El desafío de los sinónimos</h1>
      <p>Introduce tu nombre para comenzar la batería de 25 preguntas:</p>
      <input type="text" id="nombre-jugador" placeholder="Tu nombre o apodo">
      <br>
      <button class="btn-principal" onclick="iniciarJuego()">Iniciar Juego</button>
      
      <div id="seccion-ranking-inicio" style="margin-top: 30px;">
        <h2>Top 10 Mejores Puntuaciones</h2>
        <div id="ranking-lista-inicio"></div>
      </div>
    </div>

    <!-- PANTALLA DE JUEGO -->
    <div id="pantalla-juego" class="oculto">
      <div class="marcador">
        <span>Pregunta: <span id="num-pregunta">1</span>/25</span>
        <span>Puntos: <span id="puntos-actuales">0</span></span>
      </div>

      <h2 id="palabra-display">Cargando...</h2>

      <div id="pista-container" class="pista-box oculto">
        <strong>Pista:</strong> <span id="pista-texto"></span>
      </div>

      <input type="text" id="respuesta-input" placeholder="Escribe tu respuesta aquí...">
      
      <div>
        <button id="btn-responder" class="btn-principal" onclick="responder()">Responder</button>
        <button id="btn-pista" class="btn-secundario" onclick="pedirPista()">Pedir Pista</button>
        <button id="btn-rendirse" class="btn-peligro" onclick="rendirse()">Rendirse</button>
      </div>

      <div id="feedback" class="mensaje oculto"></div>
      <button id="btn-siguiente" class="btn-principal oculto" onclick="siguientePregunta()">Siguiente Pregunta</button>
    </div>

    <!-- PANTALLA FINAL -->
    <div id="pantalla-final" class="oculto">
      <h2>¡Juego Terminado!</h2>
      <p id="resultado-final"></p>
      
      <h3>Top 10 Mejores Puntuaciones</h3>
      <div id="ranking-lista-final"></div>
      
      <button class="btn-principal" onclick="reiniciarJuego()">Jugar de nuevo</button>
    </div>
  </div>

  <script>
    // ESTADO DEL JUEGO
    let bateria = [];
    let indiceActual = 0;
    let puntuacion = 0;
    let nombreJugador = "";
    let pistaUsada = false;

    // Cargar ranking al iniciar la página
    window.onload = function() {
      mostrarRanking('ranking-lista-inicio');
    };

    function iniciarJuego() {
      const inputNombre = document.getElementById('nombre-jugador').value.trim();
      if (!inputNombre) {
        alert("Por favor, introduce tu nombre.");
        return;
      }
      nombreJugador = inputNombre;
      puntuacion = 0;
      indiceActual = 0;

      // Cargar palabras desde el archivo JSON
      fetch('palabras.json')
        .then(response => response.json())
        .then(data => {
          // Seleccionar 25 palabras al azar (o todas si hay menos)
          bateria = data.sort(() => 0.5 - Math.random()).slice(0, 25);
          
          document.getElementById('pantalla-inicio').classList.add('oculto');
          document.getElementById('pantalla-juego').classList.remove('oculto');
          
          cargarPregunta();
        })
        .catch(error => {
          console.error("Error cargando palabras.json:", error);
          alert("No se pudo cargar el archivo palabras.json.");
        });
    }

  // Adaptador flexible para detectar las propiedades del JSON
    function obtenerDatosPregunta(objeto) {
      if (!objeto) return { palabra: "---", respuesta: "Desconocida", pista: "" };

      // 1. Obtener la palabra principal
      const palabra = objeto.palabra || objeto.concepto || objeto.pregunta || objeto.word || Object.values(objeto)[0] || "Pregunta";

      // 2. Búsqueda de respuesta correcta (soporta arrays, sinonimos en plural y alternativas)
      let respuesta = objeto.respuestaCorrecta || objeto.respuesta || objeto.sinonimo || objeto.sinonimos || objeto.solucion || objeto.synonym || "";

      if (Array.isArray(respuesta)) {
        respuesta = respuesta.join(", "); // Muestra todas las opciones válidas
      } else if (!respuesta && Object.keys(objeto).length > 1) {
        // Si no encuentra una clave estándar, toma el segundo dato del objeto
        respuesta = Object.values(objeto)[1];
      }

      // 3. Obtener la pista o definición
      const pista = objeto.pista || objeto.definicion || objeto.ayuda || objeto.hint || "No hay pista disponible para esta palabra.";

      return { palabra, respuesta: respuesta || "Sin respuesta definida", pista };
    }

    function cargarPregunta() {
      pistaUsada = false;
      const datos = obtenerDatosPregunta(bateria[indiceActual]);

      // Actualizar UI
      document.getElementById('num-pregunta').textContent = indiceActual + 1;
      document.getElementById('puntos-actuales').textContent = Math.round(puntuacion * 100) / 100;
      document.getElementById('palabra-display').textContent = datos.palabra;
      
      document.getElementById('respuesta-input').value = "";
      document.getElementById('respuesta-input').disabled = false;
      
      document.getElementById('pista-container').classList.add('oculto');
      document.getElementById('pista-texto').textContent = "";
      
      document.getElementById('feedback').classList.add('oculto');
      document.getElementById('btn-siguiente').classList.add('oculto');

      // Habilitar botones de acción
      document.getElementById('btn-responder').disabled = false;
      document.getElementById('btn-pista').disabled = false;
      document.getElementById('btn-rendirse').disabled = false;
    }

   function pedirPista() {
      if (!pistaUsada) {
        pistaUsada = true;
        const datos = obtenerDatosPregunta(bateria[indiceActual]);
        document.getElementById('pista-texto').textContent = datos.pista;
        document.getElementById('pista-container').classList.remove('oculto');
        document.getElementById('btn-pista').disabled = true;

        // Mantener la caja de texto activa y enfocarla
        const inputRespuesta = document.getElementById('respuesta-input');
        inputRespuesta.disabled = false;
        inputRespuesta.focus();

        // Si ya había escrito algo (p. ej. "cruel"), lo selecciona entero
        // para que se borre automáticamente al pulsar cualquier nueva letra
        if (inputRespuesta.value.length > 0) {
          inputRespuesta.select();
        }
      }
    }

   function responder() {
      const input = document.getElementById('respuesta-input');
      const respuestaUsuario = input.value.trim().toLowerCase();
      if (!respuestaUsuario) return;

      const datos = obtenerDatosPregunta(bateria[indiceActual]);
      
      // Comprobar si la respuesta coincide con alguna de las opciones válidas
      let esCorrecta = false;
      const elementoOriginal = bateria[indiceActual];
      let opcionesValidas = elementoOriginal.sinonimos || elementoOriginal.sinonimo || elementoOriginal.respuestaCorrecta || elementoOriginal.respuesta || datos.respuesta;

      if (Array.isArray(opcionesValidas)) {
        esCorrecta = opcionesValidas.some(opt => opt.toString().trim().toLowerCase() === respuestaUsuario);
      } else if (typeof opcionesValidas === 'string') {
        const lista = opcionesValidas.split(',').map(s => s.trim().toLowerCase());
        esCorrecta = lista.includes(respuestaUsuario);
      }

      bloquearControles();

      if (esCorrecta) {
        const puntosGanados = pistaUsada ? 0.75 : 1;
        puntuacion += puntosGanados;
        mostrarFeedback(`¡Correcto! Sumas ${puntosGanados} pt(s).`, "exito");
      } else {
        puntuacion -= 0.33; // Resta incluso si el marcador está en 0 o ya es negativo
        mostrarFeedback(`Incorrecto. Restas 0.33 pts. La respuesta correcta era: "${datos.respuesta}"`, "error");
      }

      // Redondeo correcto tanto para positivos como para negativos
      const puntosRedondeados = (Math.round(puntuacion * 100) / 100).toFixed(2);
      document.getElementById('puntos-actuales').textContent = puntosRedondeados;
      document.getElementById('btn-siguiente').classList.remove('oculto');
    }

    function rendirse() {
      const datos = obtenerDatosPregunta(bateria[indiceActual]);
      bloquearControles();
      
      mostrarFeedback(`Te has rendido. La respuesta correcta era: "${datos.respuesta}"`, "info");
      document.getElementById('btn-siguiente').classList.remove('oculto');
    }

    function bloquearControles() {
      document.getElementById('btn-responder').disabled = true;
      document.getElementById('btn-pista').disabled = true;
      document.getElementById('btn-rendirse').disabled = true;
      document.getElementById('respuesta-input').disabled = true;
    }

    function mostrarFeedback(mensaje, tipo) {
      const feedbackDiv = document.getElementById('feedback');
      feedbackDiv.textContent = mensaje;
      feedbackDiv.className = `mensaje ${tipo}`;
      feedbackDiv.classList.remove('oculto');
    }

    function siguientePregunta() {
      indiceActual++;
      if (indiceActual < bateria.length) {
        cargarPregunta();
      } else {
        finalizarJuego();
      }
    }

    function finalizarJuego() {
      puntuacion = Math.round(puntuacion * 100) / 100;

      document.getElementById('pantalla-juego').classList.add('oculto');
      document.getElementById('pantalla-final').classList.remove('oculto');
      
      document.getElementById('resultado-final').textContent = `${nombreJugador}, has completado la partida con ${puntuacion} puntos.`;

      guardarEnRanking(nombreJugador, puntuacion);
      mostrarRanking('ranking-lista-final');
    }

    function guardarEnRanking(nombre, puntos) {
      let ranking = JSON.parse(localStorage.getItem('ranking_juego')) || [];
      ranking.push({ nombre: nombre, puntos: puntos, fecha: new Date().toLocaleDateString() });
      
      ranking.sort((a, b) => b.puntos - a.puntos);
      ranking = ranking.slice(0, 10);
      
      localStorage.setItem('ranking_juego', JSON.stringify(ranking));
    }

    function mostrarRanking(elementId) {
      const ranking = JSON.parse(localStorage.getItem('ranking_juego')) || [];
      const contenedor = document.getElementById(elementId);

      if (ranking.length === 0) {
        contenedor.innerHTML = "<p>Aún no hay puntuaciones registradas.</p>";
        return;
      }

      let html = "<ol>";
      ranking.forEach(item => {
        html += `<li><strong>${item.nombre}</strong>: ${item.puntos} pts <small>(${item.fecha})</small></li>`;
      });
      html += "</ol>";

      contenedor.innerHTML = html;
    }

    function reiniciarJuego() {
      document.getElementById('pantalla-final').classList.add('oculto');
      document.getElementById('pantalla-inicio').classList.remove('oculto');
      mostrarRanking('ranking-lista-inicio');
    }
  </script>

</body>
</html>
